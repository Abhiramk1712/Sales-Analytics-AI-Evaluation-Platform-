version: "3.9"

services:
  db:
    image: postgres:15
    container_name: sales-analytics-db
    environment:
      POSTGRES_DB: sales_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales-analytics-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/sales_analytics
      ENVIRONMENT: development
      DEMO_MODE: "true"
      DEMO_DEFAULT_ROLE: executive
      DEMO_DEFAULT_COMPANY: techo-solutions
      AUTO_CREATE_TABLES: "true"
      ALLOW_DESTRUCTIVE_LOAD: "false"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    ports:
      - "8000:8000"
    volumes:
      - ./companies:/app/companies:ro
      - ./sample_data:/app/sample_data:ro

  frontend:
    image: node:20-alpine
    container_name: sales-analytics-frontend
    working_dir: /app/frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend

volumes:
  postgres_data:
