<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Analytics AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        /* ── Backgrounds ── */
        --color-background-primary:   #ffffff;
        --color-background-secondary: #f6f8fb;
        --color-background-tertiary:  #eef1f6;

        /* ── Text ── */
        --color-text-primary:   #0f172a;
        --color-text-secondary: #64748b;
        --color-text-tertiary:  #94a3b8;
        --color-text-inverse:   #ffffff;

        /* ── Borders ── */
        --color-border-primary:   #cbd5e1;
        --color-border-secondary: #e2e8f0;
        --color-border-tertiary:  #f1f5f9;

        /* ── Accent (primary interactive) ── */
        --color-accent-primary: #378ADD;

        /* ── Brand / semantic ── */
        --color-blue:        #3b82f6;
        --color-blue-light:  #eff6ff;
        --color-green:       #10b981;
        --color-green-light: #ecfdf5;
        --color-amber:       #f59e0b;
        --color-amber-light: #fffbeb;
        --color-red:         #ef4444;
        --color-red-light:   #fef2f2;
        --color-purple:      #8b5cf6;
        --color-purple-light:#f5f3ff;

        /* ── Radii ── */
        --border-radius-xs: 4px;
        --border-radius-sm: 6px;
        --border-radius-md: 10px;
        --border-radius-lg: 14px;
        --border-radius-xl: 20px;

        /* ── Shadows ── */
        --shadow-xs:  0 1px 2px rgba(15,23,42,0.04);
        --shadow-sm:  0 1px 6px rgba(15,23,42,0.06);
        --shadow-md:  0 4px 16px rgba(15,23,42,0.08);
        --shadow-lg:  0 8px 32px rgba(15,23,42,0.10);

        /* ── Typography ── */
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;

        /* ── Transitions ── */
        --transition-fast:   120ms ease;
        --transition-normal: 200ms ease;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; }

      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.5;
        color: var(--color-text-primary);
        background:
          radial-gradient(ellipse 80% 40% at 10% -10%, rgba(59,130,246,0.07) 0%, transparent 60%),
          radial-gradient(ellipse 60% 30% at 90% -5%, rgba(16,185,129,0.05) 0%, transparent 55%),
          radial-gradient(ellipse 50% 50% at 50% 100%, rgba(139,92,246,0.03) 0%, transparent 60%),
          #f0f4f9;
        min-height: 100vh;
      }

      /* ── Scrollbar (webkit) ── */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--color-border-primary); border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-text-tertiary); }

      /* ── Focus ring ── */
      :focus-visible {
        outline: 2px solid var(--color-blue);
        outline-offset: 2px;
        border-radius: var(--border-radius-sm);
      }

      /* ── Animations ── */
      @keyframes pulse       { 0%,100%{opacity:1} 50%{opacity:0.45} }
      @keyframes fadeIn      { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
      @keyframes shimmer     { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
      @keyframes spin        { to{transform:rotate(360deg)} }

      .fade-in { animation: fadeIn 240ms var(--transition-normal) both; }

      /* ── Skeleton shimmer ── */
      .skeleton-shimmer {
        background: linear-gradient(90deg,
          var(--color-background-secondary) 25%,
          var(--color-background-tertiary) 50%,
          var(--color-background-secondary) 75%);
        background-size: 800px 100%;
        animation: shimmer 1.6s infinite linear;
      }

      /* ── Utility ── */
      button { cursor: pointer; font-family: var(--font-sans); }
      a      { color: var(--color-blue); text-decoration: none; }
      a:hover{ text-decoration: underline; }
      select, input { font-family: var(--font-sans); }

      /* ── Table defaults ── */
      table { border-collapse: collapse; width: 100%; }
      th    { font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
