version: 2

models:
  - name: int_quota_attainment
    columns:
      - name: rep_id
        tests: [not_null]
      - name: quarter_period
        tests: [not_null]
      - name: period_status
        tests:
          - accepted_values:
              arguments:
                values: ['above_plan', 'on_track', 'at_risk', 'no_quota']
    tests:
      - unique:
          column_name: "rep_id || '-' || quarter_period"

  - name: int_team_quarter_attainment
    description: "Team-level quarterly attainment aggregated from rep-quarter grain"
    columns:
      - name: team_id
        tests: [not_null]
      - name: quarter_period
        tests: [not_null]
      - name: team_quarterly_quota_amount
        description: "Should NOT be inflated by monthly duplication"
    tests:
      - unique:
          column_name: "team_id || '-' || quarter_period"

  - name: int_payout_quality_signals
    columns:
      - name: payout_id
        tests: [not_null, unique]
      - name: signal_type
        tests:
          - accepted_values:
              arguments:
                values: ['fallback_used', 'low_confidence', 'negative_or_zero_payout', 'ok']

  - name: mart_exec_kpis
    columns:
      - name: quarter_period
        tests: [not_null]

  - name: mart_rep_performance
    columns:
      - name: rep_id
        tests: [not_null]
      - name: quarter_period
        tests: [not_null]

  - name: mart_payout_readiness
    columns:
      - name: payout_id
        tests: [not_null, unique]
      - name: readiness_status
        tests:
          - accepted_values:
              arguments:
                values: ['ready', 'review']

  - name: mart_forecast_vs_actual
    columns:
      - name: rep_id
        tests: [not_null]
      - name: month_period
        tests: [not_null]

  - name: mart_comp_plan_effectiveness
    columns:
      - name: plan_id
        tests: [not_null]
      - name: period
        tests: [not_null]

  - name: mart_pipeline_health
    columns:
      - name: stage
        tests:
          - accepted_values:
              arguments:
                values: ['Prospecting', 'Qualification', 'Proposal', 'Negotiation', 'Closed Won', 'Closed Lost']

  - name: mart_payout_anomalies
    columns:
      - name: payout_id
        tests: [not_null]
      - name: anomaly_type
        tests:
          - accepted_values:
              arguments:
                values: ['fallback_used', 'low_confidence', 'negative_or_zero_payout']
