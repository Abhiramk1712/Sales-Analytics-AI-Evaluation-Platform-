name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sales_analytics
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sales_analytics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sales_analytics
      DEMO_MODE: "true"
      DEMO_DEFAULT_ROLE: executive
      DEMO_DEFAULT_COMPANY: techo-solutions
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Hygiene check
        run: python scripts/check_package_hygiene.py --path .

      - name: Install dbt
        run: pip install -r dbt/requirements.txt

      - name: Seed reference dataset (for dbt to test against real data, not an empty DB)
        # Not `make seed`: that target invokes $(VENV_BIN)/python (.venv/bin/python),
        # which only exists after `make setup`'s local venv creation. CI installs
        # dependencies straight into the runner's system Python (see "Install backend
        # dependencies" above) and every other step here already calls tools directly
        # for that reason — this mirrors that, using the exact same args as the
        # Makefile's `seed` recipe.
        run: |
          python -m backend.data_generator \
            --company-name techo-solutions \
            --n-reps 12 --n-accounts 60 --n-deals 150 --months 36 \
            --include-org-hierarchy

      - name: Run dbt build (run + test)
        env:
          DO_NOT_TRACK: "1"
        run: |
          mkdir -p /tmp/dbt_profile
          cat > /tmp/dbt_profile/profiles.yml <<'PROFILE'
          sales_analytics_ai:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5432
                user: postgres
                password: postgres
                dbname: sales_analytics
                schema: public
                threads: 4
          PROFILE
          dbt build --project-dir dbt --profiles-dir /tmp/dbt_profile

      - name: Run backend tests
        run: pytest -q

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build
